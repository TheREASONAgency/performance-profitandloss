name: Probe Compliance Sources (temporary)

# TEMPORARY diagnostic workflow — read-only, never writes compliance.json.
# Delete once the scraper is verified against the live markup.
#
# Probe 1: plain requests.get -> HTTP 400, client-rendered Facebook shell.
# Probe 2: fuller browser headers -> HTTP 200, but still no headings and no
#          <p> at all; only headless Chromium yielded real text (12.8k chars,
#          2 headings, zero paragraphs).
# Probe 3 (this one): render all three pages in Chromium and report the DOM
#          shape of the policy content — Meta's design system builds text out
#          of divs/spans with role="heading"/aria-level, not h1-h4/p — plus
#          the rendered text itself, so the extractor can be written to what
#          the pages really are.
on:
  push:
    branches: [claude/rea-pacing-feed-architecture-zycx8u]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Report the rendered DOM shape of each policy page
        run: |
          python3 - <<'PY'
          import sys, pathlib, json, re
          sys.path.insert(0, "scripts")
          import scrape_compliance as sc
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          pathlib.Path("probe").mkdir(exist_ok=True)
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          summary = {}

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for source in sc.SOURCES:
                  print("=" * 78)
                  print(f"SOURCE {source['id']}  {source['url']}")
                  print("=" * 78)
                  page = browser.new_page(user_agent=UA,
                                          viewport={"width": 1280, "height": 2400},
                                          locale="en-US")
                  try:
                      resp = page.goto(source["url"], wait_until="networkidle", timeout=60000)
                      page.wait_for_timeout(3000)
                      html = page.content()
                      status = resp.status if resp else None
                  except Exception as exc:
                      print(f"  RENDER FAILED: {exc}")
                      page.close()
                      continue

                  pathlib.Path(f"probe/{source['id']}.html").write_text(html, encoding="utf-8")
                  soup = BeautifulSoup(html, "html.parser")

                  counts = {t: len(soup.find_all(t))
                            for t in ("h1","h2","h3","h4","h5","h6","p","li","div","span","article","main")}
                  counts["role=heading"] = len(soup.select('[role="heading"]'))
                  counts["aria-level"] = len(soup.select("[aria-level]"))
                  counts["role=main"] = len(soup.select('[role="main"]'))
                  counts["role=article"] = len(soup.select('[role="article"]'))
                  print(f"  status={status} bytes={len(html)}")
                  print(f"  tag counts: {counts}")

                  print("  --- heading-ish elements (h1-h6 + role=heading) ---")
                  for h in soup.select('h1,h2,h3,h4,h5,h6,[role="heading"]')[:50]:
                      level = h.get("aria-level") or h.name
                      classes = " ".join(h.get("class", []))[:40]
                      print(f"    <{h.name} level={level} class='{classes}'> "
                            f"{sc.clean_text(h.get_text(' '))[:100]}")

                  # What does the visible text look like, and where does it live?
                  body_text = page.inner_text("body")
                  print(f"  --- rendered inner_text: {len(body_text)} chars ---")
                  for line in body_text.splitlines()[:120]:
                      line = line.strip()
                      if line:
                          print(f"    | {line[:150]}")

                  # Which container holds the bulk of the policy text?
                  best = None
                  for div in soup.find_all(["div", "section", "article", "main"]):
                      t = sc.clean_text(div.get_text(" "))
                      if 500 < len(t) < 40000:
                          kids = div.find_all(["div", "section"], recursive=False)
                          if best is None or len(t) < best[1]:
                              best = (div, len(t), len(kids))
                  if best:
                      div, n, kids = best
                      print(f"  --- tightest container holding the text: <{div.name} "
                            f"class='{' '.join(div.get('class', []))[:60]}' "
                            f"id='{div.get('id')}'> {n} chars, {kids} direct block children ---")

                  summary[source["id"]] = {
                      "status": status, "bytes": len(html),
                      "headingish": counts["h1"] + counts["h2"] + counts["h3"]
                                    + counts["role=heading"],
                      "inner_text_chars": len(body_text),
                  }
                  page.close()
                  print()
              browser.close()

          print("SUMMARY: " + json.dumps(summary, indent=2))
          PY

      - name: Upload rendered HTML for offline parser work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-rendered-html
          path: probe/
          retention-days: 5
