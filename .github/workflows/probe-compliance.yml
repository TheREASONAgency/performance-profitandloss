name: Probe Compliance Sources (temporary)

# TEMPORARY diagnostic workflow. Delete once the scraper is verified.
#
# Probe 1: plain requests.get -> HTTP 400, client-rendered Facebook shell.
# Probe 2: fuller browser headers -> 200, but no <p> and no real headings;
#          only headless Chromium yielded actual text.
# Probe 3: rendered pages carry ~23 heading-ish elements (many of them site
#          chrome) and 6.5-11.7k chars of real policy text, plus Meta's own
#          CHANGE LOG with dates.
# Probe 4 (this one): the artifact download is unreachable from the authoring
#          session (blob storage is blocked), so this commits a distilled
#          capture — the content root's HTML plus a structural outline — to
#          probe_capture/ on this branch, where it can be pulled and used to
#          build the extractor offline against real markup.
on:
  push:
    branches: [claude/rea-pacing-feed-architecture-zycx8u]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-compliance
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture the rendered content root of each policy page
        run: |
          python3 - <<'PY'
          import sys, pathlib, json
          sys.path.insert(0, "scripts")
          import scrape_compliance as sc
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          out = pathlib.Path("probe_capture")
          out.mkdir(exist_ok=True)
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")

          # Candidate content roots, most specific first.
          ROOTS = ["main", '[role="main"]', "#content", '[data-testid="content"]']

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for source in sc.SOURCES:
                  print("=" * 78)
                  print(f"SOURCE {source['id']}")
                  page = browser.new_page(user_agent=UA,
                                          viewport={"width": 1280, "height": 2400},
                                          locale="en-US")
                  page.goto(source["url"], wait_until="networkidle", timeout=60000)
                  page.wait_for_timeout(3000)
                  html = page.content()
                  soup = BeautifulSoup(html, "html.parser")

                  chosen, root = None, None
                  for sel in ROOTS:
                      found = soup.select(sel)
                      for cand in found:
                          text = sc.clean_text(cand.get_text(" "))
                          print(f"  candidate {sel}: {len(found)} match(es), "
                                f"first has {len(text)} chars")
                          if len(text) > 800:
                              chosen, root = sel, cand
                          break
                      if root is not None:
                          break
                  if root is None:
                      print("  no content root matched; falling back to <body>")
                      chosen, root = "body", soup.body

                  print(f"  using root: {chosen}")

                  # Structural outline: every element carrying its own text.
                  outline = []
                  for elem in root.find_all(True):
                      own = "".join(c for c in elem.children
                                    if isinstance(c, str)).strip()
                      if not own:
                          continue
                      depth = len(list(elem.parents))
                      outline.append({
                          "depth": depth,
                          "tag": elem.name,
                          "role": elem.get("role"),
                          "aria_level": elem.get("aria-level"),
                          "classes": " ".join(elem.get("class", []))[:60],
                          "text": sc.clean_text(own)[:400],
                      })

                  (out / f"{source['id']}.outline.json").write_text(
                      json.dumps({"url": source["url"], "root": chosen,
                                  "outline": outline}, indent=1), encoding="utf-8")
                  (out / f"{source['id']}.root.html").write_text(
                      str(root), encoding="utf-8")

                  print(f"  outline entries: {len(outline)}")
                  print(f"  root html bytes: {len(str(root))}")
                  for row in outline[:40]:
                      print(f"    d{row['depth']:<3} <{row['tag']} role={row['role']} "
                            f"lvl={row['aria_level']}> {row['text'][:90]}")
                  page.close()
              browser.close()
          PY

      - name: Commit the capture to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_capture/
          if git diff --cached --quiet; then
            echo "No capture change"
          else
            git commit -m "probe: capture rendered policy page structure"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
