name: Refresh Account Status

# Rebuilds status.json (the Account Status tab) at 6:00 AM Eastern on Monday,
# Wednesday and Friday. GitHub cron is UTC-only and ignores daylight saving, so
# we fire at BOTH candidate UTC hours and let the gate step allow exactly one:
#   06:00 Eastern = 10:00 UTC (EDT) or 11:00 UTC (EST)
on:
  schedule:
    - cron: "0 10,11 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Manual runs always proceed; scheduled runs must land on 6 AM Eastern.
      - name: Should this run proceed?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "decision=run" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" = "06" ]; then
            echo "decision=run" >> "$GITHUB_OUTPUT"
          else
            echo "Not 6 AM Eastern — skipping (the other DST cron will run)."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Run logic tests
        if: steps.gate.outputs.decision == 'run'
        run: node --test tests/status-logic.test.js tests/sheet-board.test.js

      # Writes status.json, then exits non-zero if a source failed, so the
      # commit step below still runs (always()) and the failure shows red.
      - name: Rebuild status.json
        id: build
        if: steps.gate.outputs.decision == 'run'
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/refresh_status.js

      - name: Commit if changed
        if: always() && steps.gate.outputs.decision == 'run'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- status.json; then
            echo "No change in status.json"
          else
            git add status.json
            git commit -m "status: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
