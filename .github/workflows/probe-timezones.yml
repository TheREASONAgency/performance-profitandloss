name: Probe Revision Date Stability (temporary)

# TEMPORARY. Two renders of the same page reported different CHANGE LOG
# dates, and it matters: those dates are what the Compliance tab presents as
# "Meta last revised this policy". This isolates the cause — render each
# page twice under UTC (is it nondeterministic?) and once each under
# America/New_York and America/Los_Angeles (is it purely the timezone?).
# Delete once the timezone question is settled.
on:
  push:
    branches: [claude/rea-pacing-feed-architecture-zycx8u]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Compare revision dates across timezones and repeats
        run: |
          python3 - <<'PY'
          import sys, datetime as dt
          sys.path.insert(0, "scripts")
          import scrape_compliance as sc
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          TODAY = dt.date(2026, 9, 6)
          RUNS = [("UTC", "UTC"), ("UTC-repeat", "UTC"),
                  ("America/New_York", "America/New_York"),
                  ("America/Los_Angeles", "America/Los_Angeles")]
          results = {}

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, tz in RUNS:
                  for source in sc.SOURCES:
                      page = browser.new_page(
                          user_agent=sc.USER_AGENT,
                          viewport={"width": 1280, "height": 2400},
                          locale="en-US", timezone_id=tz)
                      page.goto(source["url"], wait_until="networkidle", timeout=60000)
                      page.wait_for_timeout(3000)
                      html = page.content()
                      page.close()

                      soup = BeautifulSoup(html, "html.parser")
                      for t in soup(["style", "script"]):
                          t.decompose()
                      dates = sc.policy_update_dates(soup, TODAY)
                      results.setdefault(source["id"], {})[label] = dates
                      print(f"{source['id']:<24} {label:<22} {dates}")
              browser.close()

          print()
          print("=== verdict ===")
          for sid, by_run in results.items():
              utc1, utc2 = by_run.get("UTC"), by_run.get("UTC-repeat")
              stable = utc1 == utc2
              print(f"{sid}: UTC deterministic={stable}")
              if not stable:
                  print(f"   run1={utc1}\n   run2={utc2}")
              for label in ("America/New_York", "America/Los_Angeles"):
                  print(f"   {label}: {by_run.get(label)}")
          PY
